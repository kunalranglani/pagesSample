<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Millionaire</title>
  <style>
    :root {
      --night: #081827;
      --midnight: #12324f;
      --gold: #ffd166;
      --cyan: #7bdff2;
      --mint: #b8f2e6;
      --ink: #f7fbff;
      --muted: #c6dcef;
      --panel: rgba(8, 20, 39, 0.88);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(255, 209, 102, 0.2), transparent 34%),
        radial-gradient(circle at 18% 86%, rgba(123, 223, 242, 0.2), transparent 28%),
        linear-gradient(180deg, #081827 0%, #12324f 60%, #081827 100%);
      padding: 20px 14px 34px;
    }

    .shell { max-width: 1220px; margin: 0 auto; }

    .game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      background: linear-gradient(180deg, rgba(20, 41, 75, 0.88), rgba(7, 16, 32, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    .stage {
      padding: 12px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(8, 20, 39, 0.66), rgba(7, 16, 32, 0.9));
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      color: var(--cyan);
      background: rgba(123, 223, 242, 0.1);
    }

    .question-box {
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--panel);
      padding: 20px;
      min-height: 350px;
    }

    .category {
      margin: 0 0 10px;
      color: var(--gold);
      text-transform: uppercase;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .question {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      line-height: 1.2;
    }

    .answers {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .answer {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(19, 41, 75, 0.95), rgba(8, 20, 39, 0.95));
      color: var(--ink);
      font: inherit;
      text-align: left;
      padding: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease;
    }

    .answer:hover,
    .answer:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 209, 102, 0.9);
      outline: none;
    }

    .answer:disabled { cursor: default; }

    .answer.correct {
      border-color: rgba(184, 242, 230, 0.9);
      background: linear-gradient(180deg, rgba(112, 224, 0, 0.3), rgba(30, 96, 25, 0.85));
    }

    .answer.wrong {
      border-color: rgba(255, 107, 107, 0.9);
      background: linear-gradient(180deg, rgba(255, 107, 107, 0.3), rgba(106, 21, 21, 0.85));
    }

    .letter {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--gold);
      background: rgba(255, 209, 102, 0.14);
      font-weight: 900;
      flex: 0 0 auto;
    }

    .side { display: grid; gap: 12px; align-content: start; }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px;
    }

    .card h2,
    .card h3 { margin: 0 0 8px; }

    .status { color: var(--muted); line-height: 1.55; margin: 0; }

    .ladder {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .ladder li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .ladder li.safe { border-color: rgba(123, 223, 242, 0.4); }

    .ladder li.active {
      color: #05101f;
      background: linear-gradient(135deg, var(--gold), #ffe7aa);
      border-color: rgba(255, 255, 255, 0.45);
      font-weight: 800;
      transform: translateX(-6px);
    }

    .ladder li.cleared {
      color: var(--mint);
      background: rgba(112, 224, 0, 0.12);
    }

    .message {
      min-height: 72px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      line-height: 1.55;
      color: var(--ink);
    }

    .message.good { border-color: rgba(112, 224, 0, 0.45); }
    .message.bad { border-color: rgba(255, 107, 107, 0.45); }

    button.reset {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 980px) {
      .game { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .question-box { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="game">
      <div class="stage">
        <div class="top">
          <div class="pill" id="roundBadge">Question 1 of 15</div>
          <div class="pill" id="winningsBadge">Current winnings: $0</div>
        </div>

        <div class="question-box">
          <p class="category" id="category">Star Wars Trivia</p>
          <p class="question" id="question">Loading first Star Wars trivia question...</p>
          <div class="answers" id="answers"></div>
        </div>
      </div>

      <aside class="side">
        <div class="card">
          <h2>Prize Ladder</h2>
          <ol class="ladder" id="ladder"></ol>
        </div>

        <div class="card">
          <h3 id="statusTitle">Question One</h3>
          <p class="status" id="statusCopy">Answer each Star Wars question correctly to climb to the top prize.</p>
          <p class="message" id="message">Pick one of the four options.</p>
          <button class="reset" id="newGame" type="button">New Game</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const prizes = [
      100, 200, 300, 500, 1000,
      2000, 4000, 8000, 16000, 32000,
      64000, 125000, 250000, 500000, 1000000
    ];
    const safeLevels = [5, 10];
    const letters = ["A", "B", "C", "D"];

    const trivia = [
      { category: "Hero", prompt: "Who is Luke Skywalker's father?", answer: "Darth Vader" },
      { category: "Princess", prompt: "What is Princess Leia's last name?", answer: "Organa" },
      { category: "Droid", prompt: "Which droid is known for saying beeps and whistles and is blue and white?", answer: "R2-D2" },
      { category: "Droid", prompt: "Which protocol droid is fluent in over six million forms of communication?", answer: "C-3PO" },
      { category: "Ship", prompt: "What is Han Solo's famous ship called?", answer: "Millennium Falcon" },
      { category: "Wookiee", prompt: "Who is Han Solo's Wookiee co-pilot?", answer: "Chewbacca" },
      { category: "Villain", prompt: "What color is Darth Vader's lightsaber?", answer: "Red" },
      { category: "Jedi", prompt: "Who trained Luke Skywalker on Dagobah?", answer: "Yoda" },
      { category: "Planet", prompt: "On which desert planet did Luke grow up?", answer: "Tatooine" },
      { category: "Order", prompt: "What title is used for elite dark side users like Vader and Maul?", answer: "Sith" },
      { category: "Weapon", prompt: "What energy weapon do Jedi and Sith use?", answer: "Lightsaber" },
      { category: "Group", prompt: "What is the name of the heroes fighting the Empire in the original trilogy?", answer: "Rebel Alliance" },
      { category: "Empire", prompt: "Who is the Emperor in the original trilogy?", answer: "Palpatine" },
      { category: "Clone Wars", prompt: "What rank is commonly used for Anakin Skywalker in the prequel era?", answer: "Jedi Knight" },
      { category: "Bounty Hunter", prompt: "Which armored bounty hunter appears in The Empire Strikes Back and Return of the Jedi?", answer: "Boba Fett" },
      { category: "Planet", prompt: "What forest moon appears in Return of the Jedi?", answer: "Endor" },
      { category: "Species", prompt: "What species is Yoda?", answer: "Unknown" },
      { category: "Team", prompt: "What squadron includes Luke during the Death Star battle?", answer: "Red Squadron" },
      { category: "Code", prompt: "What phrase describes the mystical energy field used by Jedi?", answer: "The Force" },
      { category: "Planet", prompt: "What icy planet appears at the start of The Empire Strikes Back?", answer: "Hoth" },
      { category: "Pilot", prompt: "Who is known as one of the best pilots in the galaxy and is Leia's brother?", answer: "Luke Skywalker" },
      { category: "Smuggler", prompt: "Who says, 'Never tell me the odds'?", answer: "Han Solo" },
      { category: "Jedi", prompt: "What title is used for Obi-Wan Kenobi in the prequels and originals?", answer: "Jedi Master" },
      { category: "Leader", prompt: "Who leads the Resistance in the sequel trilogy as a general?", answer: "Leia" },
      { category: "Villain", prompt: "Who is Kylo Ren's birth father?", answer: "Han Solo" },
      { category: "Ship", prompt: "What small starfighter does Luke use in the Death Star trench run?", answer: "X-wing" },
      { category: "Ship", prompt: "What Imperial fighter has two vertical wings?", answer: "TIE Fighter" },
      { category: "Planet", prompt: "What city on the gas giant Bespin is famous in The Empire Strikes Back?", answer: "Cloud City" },
      { category: "Creature", prompt: "What kind of creature is Jabba's palace mascot Salacious Crumb?", answer: "Kowakian monkey-lizard" },
      { category: "Jedi", prompt: "Who is Anakin Skywalker's master during the Clone Wars?", answer: "Obi-Wan Kenobi" },
      { category: "Clone Wars", prompt: "What are the soldiers of the Republic called?", answer: "Clone Troopers" },
      { category: "Location", prompt: "What desert planet is home to the Tusken Raiders and Jawas?", answer: "Tatooine" },
      { category: "Location", prompt: "What jungle moon is home to the Ewoks?", answer: "Endor" },
      { category: "Force", prompt: "What power lets Jedi move objects with their mind?", answer: "The Force" },
      { category: "Weapon", prompt: "What is the name of a Sith or Jedi sword?", answer: "Lightsaber" },
      { category: "Character", prompt: "Who is the smuggler who often flies the Millennium Falcon?", answer: "Han Solo" },
      { category: "Character", prompt: "Who trained Rey in The Last Jedi?", answer: "Luke Skywalker" },
      { category: "Order", prompt: "What are the Jedi guardians of peace and justice called?", answer: "Jedi" },
      { category: "Order", prompt: "What dark side title is used for Emperor Palpatine?", answer: "Sith Lord" },
      { category: "Droid", prompt: "What color is BB-8?", answer: "Orange and white" },
      { category: "Droid", prompt: "Which astromech droid is smaller and spherical?", answer: "BB-8" },
      { category: "Droid", prompt: "What is K-2SO?", answer: "Security droid" },
      { category: "Pilot", prompt: "Who is the Resistance pilot nicknamed Poe?", answer: "Poe Dameron" },
      { category: "Pilot", prompt: "Who is known as the scavenger on Jakku in the sequel trilogy?", answer: "Rey" },
      { category: "Character", prompt: "Who is the son of Han Solo and Leia?", answer: "Ben Solo" },
      { category: "Character", prompt: "What name does Ben Solo use as a villain?", answer: "Kylo Ren" },
      { category: "Character", prompt: "Who is the bounty hunter who famously says 'This is the way'?", answer: "The Mandalorian" },
      { category: "Character", prompt: "What is the first name of the Mandalorian title character?", answer: "Din" },
      { category: "Planet", prompt: "What planet is the homeworld of the Wookiees?", answer: "Kashyyyk" },
      { category: "Planet", prompt: "What planet is the homeworld of the Gungans?", answer: "Naboo" },
      { category: "Planet", prompt: "What swampy planet is where Dagobah appears?", answer: "Dagobah" },
      { category: "Planet", prompt: "What planet is the base of the New Republic in some stories?", answer: "Hosnian Prime" },
      { category: "Vehicle", prompt: "What vehicle is commonly flown by Jedi starfighter pilots?", answer: "Starfighter" },
      { category: "Vehicle", prompt: "What giant armored vehicle walks on legs in the Empire?", answer: "AT-AT" },
      { category: "Vehicle", prompt: "What smaller Imperial transport has two legs and a cannon?", answer: "AT-ST" },
      { category: "Vehicle", prompt: "What ship is Princess Leia captured on at the start of A New Hope?", answer: "Tantive IV" },
      { category: "Weapon", prompt: "What color is a Jedi's classic lightsaber blade?", answer: "Blue" },
      { category: "Weapon", prompt: "What color is a Sith's classic lightsaber blade?", answer: "Red" },
      { category: "Weapon", prompt: "What weapon is the Mandalorian often seen carrying?", answer: "Blaster" },
      { category: "Weapon", prompt: "What weapon does Chewbacca use?", answer: "Bowcaster" },
      { category: "Group", prompt: "What are clone soldiers often called in the prequels?", answer: "Clone Troopers" },
      { category: "Group", prompt: "What is the name of the anti-Empire force led by Leia?", answer: "Resistance" },
      { category: "Group", prompt: "What is the name of the anti-Empire force in the original trilogy?", answer: "Rebel Alliance" },
      { category: "Villain", prompt: "Who is also known as Darth Sidious?", answer: "Palpatine" },
      { category: "Villain", prompt: "Who trained Darth Vader?", answer: "Palpatine" },
      { category: "Villain", prompt: "Who is the Sith Lord with a double-bladed lightsaber in The Phantom Menace?", answer: "Darth Maul" },
      { category: "Villain", prompt: "Who is the bounty hunter hired to capture the Millennium Falcon in The Empire Strikes Back?", answer: "Boba Fett" },
      { category: "Jedi", prompt: "Who says, 'Do or do not. There is no try.'", answer: "Yoda" },
      { category: "Jedi", prompt: "Who is the Jedi General with a blue lightsaber and a black glove?", answer: "Anakin Skywalker" },
      { category: "Jedi", prompt: "Who is the old Jedi master that trains Luke on Dagobah?", answer: "Yoda" },
      { category: "Jedi", prompt: "Who is Obi-Wan's apprentice in the prequels?", answer: "Anakin Skywalker" },
      { category: "Location", prompt: "Where is the famous cantina in A New Hope?", answer: "Mos Eisley" },
      { category: "Location", prompt: "What icy base do the Rebels use in The Empire Strikes Back?", answer: "Echo Base" },
      { category: "Location", prompt: "Where does the Death Star's construction appear as a battle setting in Rogue One?", answer: "Scarif" },
      { category: "Location", prompt: "What city sits inside a giant hollowed-out asteroid in The Mandalorian?", answer: "Nevarro" },
      { category: "Species", prompt: "What species is Chewbacca?", answer: "Wookiee" },
      { category: "Species", prompt: "What species is Yoda most commonly associated with?", answer: "Unknown" },
      { category: "Species", prompt: "What species are the little desert scavengers on Tatooine?", answer: "Jawas" },
      { category: "Species", prompt: "What species are the creatures with long ears and big eyes on Naboo?", answer: "Gungans" },
      { category: "Story", prompt: "What is the first Star Wars movie released in 1977 later renamed?", answer: "A New Hope" },
      { category: "Story", prompt: "What is the second film in the original trilogy?", answer: "The Empire Strikes Back" },
      { category: "Story", prompt: "What is the final film in the original trilogy?", answer: "Return of the Jedi" },
      { category: "Story", prompt: "What is the title of the first movie in the sequel trilogy?", answer: "The Force Awakens" },
      { category: "Story", prompt: "What is the title of the prequel film about Anakin's fall?", answer: "Revenge of the Sith" },
      { category: "Story", prompt: "What is the title of the movie that introduces Qui-Gon and young Anakin?", answer: "The Phantom Menace" },
      { category: "Story", prompt: "What is the title of the film set during the Clone Wars with battle droids?", answer: "Attack of the Clones" },
      { category: "Story", prompt: "What is the title of the film about the destruction of Alderaan?", answer: "A New Hope" },
      { category: "Story", prompt: "What is the title of the movie where Han is frozen in carbonite?", answer: "The Empire Strikes Back" },
      { category: "Story", prompt: "What is the title of the movie with the battle on Endor?", answer: "Return of the Jedi" }
    ];

    let game;

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = rand(0, index);
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function money(value) {
      return "$" + value.toLocaleString("en-US");
    }

    function choicesWithCorrect(correct) {
      const pool = trivia.map(function (item) { return item.answer; });
      const set = new Set([correct]);
      while (set.size < 4) {
        set.add(pool[rand(0, pool.length - 1)]);
      }
      return shuffle(Array.from(set));
    }

    function buildDeck() {
      return shuffle(trivia).slice(0, 15).map(function (item) {
        return {
          category: item.category,
          prompt: item.prompt,
          correct: item.answer,
          choices: choicesWithCorrect(item.answer)
        };
      });
    }

    function fallback(round) {
      if (round >= 10) return prizes[9];
      if (round >= 5) return prizes[4];
      return 0;
    }

    function newState() {
      return {
        round: 0,
        winnings: 0,
        complete: false,
        locked: false,
        deck: buildDeck()
      };
    }

    function renderLadder() {
      const ladder = document.getElementById("ladder");
      ladder.innerHTML = prizes.slice().reverse().map(function (prize, reverseIndex) {
        const level = prizes.length - reverseIndex;
        const classes = [];
        if (safeLevels.includes(level)) classes.push("safe");
        if (game.round === level && !game.complete) classes.push("active");
        if (level < game.round || (game.complete && game.round >= level)) classes.push("cleared");
        return "<li class=\"" + classes.join(" ") + "\"><span>" + level + "</span><span>" + money(prize) + "</span></li>";
      }).join("");
    }

    function render() {
      const roundBadge = document.getElementById("roundBadge");
      const winningsBadge = document.getElementById("winningsBadge");
      const category = document.getElementById("category");
      const question = document.getElementById("question");
      const answers = document.getElementById("answers");
      const message = document.getElementById("message");

      renderLadder();
      winningsBadge.textContent = "Current winnings: " + money(game.winnings);

      if (game.complete) {
        roundBadge.textContent = "Game complete";
        category.textContent = "Champion";
        question.textContent = "You reached the top prize.";
        answers.innerHTML = "";
        message.className = "message good";
        message.textContent = "You are the Star Wars millionaire. Start a new game to play again.";
        return;
      }

      const q = game.deck[game.round];
      roundBadge.textContent = "Question " + (game.round + 1) + " of " + game.deck.length;
      category.textContent = q.category;
      question.textContent = q.prompt;
      answers.innerHTML = q.choices.map(function (choice, index) {
        return "<button class=\"answer\" type=\"button\" data-choice=\"" + choice + "\"><span class=\"letter\">" + letters[index] + "</span><span>" + choice + "</span></button>";
      }).join("");

      message.className = "message";
      message.textContent = "Pick one of the four options.";

      answers.querySelectorAll(".answer").forEach(function (button) {
        button.addEventListener("click", function () {
          submit(button.dataset.choice, button);
        });
      });
    }

    function markCorrect(correct) {
      document.querySelectorAll(".answer").forEach(function (button) {
        if (button.dataset.choice === correct) button.classList.add("correct");
      });
    }

    function disableAnswers() {
      document.querySelectorAll(".answer").forEach(function (button) {
        button.disabled = true;
      });
    }

    function submit(choice, button) {
      if (game.locked || game.complete) return;

      game.locked = true;
      disableAnswers();

      const q = game.deck[game.round];
      const statusTitle = document.getElementById("statusTitle");
      const statusCopy = document.getElementById("statusCopy");
      const message = document.getElementById("message");

      if (choice === q.correct) {
        button.classList.add("correct");
        game.winnings = prizes[game.round];
        game.round += 1;

        if (game.round >= game.deck.length) {
          game.complete = true;
          statusTitle.textContent = "Star Wars Millionaire";
          statusCopy.textContent = "You answered every Star Wars question correctly and reached the top prize.";
          render();
          game.locked = false;
          return;
        }

        statusTitle.textContent = "Still Climbing";
        statusCopy.textContent = "Correct answer. You moved one step higher on the prize ladder.";
        message.className = "message good";
        message.textContent = "Correct. You climb to " + money(game.winnings) + ".";

        window.setTimeout(function () {
          game.locked = false;
          render();
        }, 900);
        return;
      }

      button.classList.add("wrong");
      markCorrect(q.correct);
      game.winnings = fallback(game.round);
      game.complete = true;
      statusTitle.textContent = "Game Over";
      statusCopy.textContent = "Wrong answer. You dropped to the last safe level reached.";
      message.className = "message bad";
      message.textContent = "The correct answer was " + q.correct + ". You leave with " + money(game.winnings) + ".";
      renderLadder();
      document.getElementById("winningsBadge").textContent = "Current winnings: " + money(game.winnings);
      game.locked = false;
    }

    function startGame() {
      game = newState();
      document.getElementById("statusTitle").textContent = "Question One";
      document.getElementById("statusCopy").textContent = "Answer each Star Wars question correctly to climb to the top prize.";
      render();
    }

    document.getElementById("newGame").addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
