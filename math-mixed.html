<!DOCTYPE html>
<html>
<head>
    <title>Math Practice - Mixed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            text-decoration: underline;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .problem {
            width: 100px;
            margin: 20px;
            margin-bottom: 50px;
            font-size: 20px;
            text-align: right;
        }

            .problem div {
                margin-bottom: 5px;
            }

        .long-division {
            width: 100px;
            margin: 20px;
            margin-bottom: 50px;
            font-size: 24px;
        }

        .quotient-line {
            width: 54px;
            height: 18px;
            margin-left: 42px;
            border-bottom: 2px solid #111;
        }

        .division-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            line-height: 1;
        }

        .divisor {
            width: 24px;
            padding-right: 6px;
            text-align: right;
        }

        .dividend {
            min-width: 54px;
            padding: 2px 0 0 8px;
            border-top: 2px solid #111;
            border-left: 2px solid #111;
            text-align: right;
        }
    </style>
</head>
<body>


    <div id="problemsContainer" class="container"></div>

    <script>
        function getRandomIntInclusive(min, max) {
            min = Math.ceil(min);
            max = Math.floor(max);
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        function generateQuestions() {
            const container = document.getElementById("problemsContainer");
            const operations = ['+', '-', '×'];

            for (let i = 0; i < 24; i++) {
                const operation = operations[Math.floor(Math.random() * operations.length)];
                let a, b;

                if (operation === '×') {
                    a = getRandomIntInclusive(10, 99);
                    b = getRandomIntInclusive(2, 9);
                }
                else {
                    a = getRandomIntInclusive(100, 999);
                    b = getRandomIntInclusive(100, 999);

                    if (Math.random() < 0.4) {
                        b = getRandomIntInclusive(11, 99);
                    }

                    // For subtraction and addition, ensure first number is bigger than second
                    if (operation !== 'x' && b > a) {
                        [a, b] = [b, a];
                    }
                }


                let problemDiv = document.createElement("div");
                problemDiv.className = "problem";
                problemDiv.innerHTML = `
                        <div>&nbsp; ${a}</div>
                        <div>${operation} ${b}</div>
                        <div>______</div>
                    `;
                container.appendChild(problemDiv);
            }

                for (let i = 0; i < 6; i++) {
                    const divisor = getRandomIntInclusive(2, 5);
                    const quotient = getRandomIntInclusive(11, Math.floor(99 / divisor));
                    const dividend = divisor * quotient;
                    const problemDiv = document.createElement("div");
                    problemDiv.className = "long-division";
                    problemDiv.innerHTML = `
                        <div class="quotient-line"></div>
                        <div class="division-row">
                            <div class="divisor">${divisor}</div>
                            <div class="dividend">${dividend}</div>
                        </div>
                    `;
                    container.appendChild(problemDiv);
                }

                const problems = Array.from(container.children);
                problems.sort(function () {
                    return Math.random() - 0.5;
                });
                problems.forEach(function (problem) {
                    container.appendChild(problem);
                });
        }

        generateQuestions();
    </script>

</body>
</html>
