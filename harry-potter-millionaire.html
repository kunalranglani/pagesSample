<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harry Potter Millionaire</title>
  <style>
    :root {
      --night: #1a1229;
      --midnight: #2e1f4d;
      --gold: #ffd166;
      --cyan: #8be9fd;
      --mint: #b8f2e6;
      --ink: #f7fbff;
      --muted: #d7d6ef;
      --panel: rgba(24, 17, 41, 0.88);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(255, 209, 102, 0.22), transparent 34%),
        radial-gradient(circle at 20% 85%, rgba(139, 233, 253, 0.15), transparent 26%),
        linear-gradient(180deg, #1a1229 0%, #2e1f4d 60%, #1a1229 100%);
      padding: 20px 14px 34px;
    }

    .shell { max-width: 1220px; margin: 0 auto; }

    .game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      background: linear-gradient(180deg, rgba(52, 33, 89, 0.9), rgba(20, 13, 34, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    .stage {
      padding: 12px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(27, 18, 47, 0.7), rgba(20, 13, 34, 0.92));
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      color: var(--cyan);
      background: rgba(139, 233, 253, 0.1);
    }

    .question-box {
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--panel);
      padding: 20px;
      min-height: 350px;
    }

    .category {
      margin: 0 0 10px;
      color: var(--gold);
      text-transform: uppercase;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .question {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      line-height: 1.2;
    }

    .answers {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .answer {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(52, 33, 89, 0.95), rgba(24, 16, 42, 0.95));
      color: var(--ink);
      font: inherit;
      text-align: left;
      padding: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease;
    }

    .answer:hover,
    .answer:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 209, 102, 0.9);
      outline: none;
    }

    .answer:disabled { cursor: default; }

    .answer.correct {
      border-color: rgba(184, 242, 230, 0.9);
      background: linear-gradient(180deg, rgba(112, 224, 0, 0.3), rgba(30, 96, 25, 0.85));
    }

    .answer.wrong {
      border-color: rgba(255, 107, 107, 0.9);
      background: linear-gradient(180deg, rgba(255, 107, 107, 0.3), rgba(106, 21, 21, 0.85));
    }

    .letter {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--gold);
      background: rgba(255, 209, 102, 0.14);
      font-weight: 900;
      flex: 0 0 auto;
    }

    .side { display: grid; gap: 12px; align-content: start; }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px;
    }

    .card h2,
    .card h3 { margin: 0 0 8px; }

    .status { color: var(--muted); line-height: 1.55; margin: 0; }

    .ladder {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .ladder li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .ladder li.safe { border-color: rgba(139, 233, 253, 0.4); }

    .ladder li.active {
      color: #05101f;
      background: linear-gradient(135deg, var(--gold), #ffe7aa);
      border-color: rgba(255, 255, 255, 0.45);
      font-weight: 800;
      transform: translateX(-6px);
    }

    .ladder li.cleared {
      color: var(--mint);
      background: rgba(112, 224, 0, 0.12);
    }

    .message {
      min-height: 72px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      line-height: 1.55;
      color: var(--ink);
    }

    .message.good { border-color: rgba(112, 224, 0, 0.45); }
    .message.bad { border-color: rgba(255, 107, 107, 0.45); }

    button.reset {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 980px) {
      .game { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .question-box { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="game">
      <div class="stage">
        <div class="top">
          <div class="pill" id="roundBadge">Question 1 of 15</div>
          <div class="pill" id="winningsBadge">Current winnings: $0</div>
        </div>

        <div class="question-box">
          <p class="category" id="category">Wizarding Trivia</p>
          <p class="question" id="question">Loading first Harry Potter trivia question...</p>
          <div class="answers" id="answers"></div>
        </div>
      </div>

      <aside class="side">
        <div class="card">
          <h2>Prize Ladder</h2>
          <ol class="ladder" id="ladder"></ol>
        </div>

        <div class="card">
          <h3 id="statusTitle">Question One</h3>
          <p class="status" id="statusCopy">Answer each Harry Potter question correctly to climb to the top prize.</p>
          <p class="message" id="message">Pick one of the four options.</p>
          <button class="reset" id="newGame" type="button">New Game</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const prizes = [
      100, 200, 300, 500, 1000,
      2000, 4000, 8000, 16000, 32000,
      64000, 125000, 250000, 500000, 1000000
    ];
    const safeLevels = [5, 10];
    const letters = ["A", "B", "C", "D"];

    const trivia = [
      { category: "Houses", prompt: "Which house is Harry Potter sorted into?", answer: "Gryffindor" },
      { category: "Headmaster", prompt: "Who is the headmaster of Hogwarts in Harry's first year?", answer: "Albus Dumbledore" },
      { category: "School", prompt: "What is the name of Harry's school of witchcraft and wizardry?", answer: "Hogwarts" },
      { category: "Villain", prompt: "What name is often used for the main dark wizard enemy?", answer: "Voldemort" },
      { category: "Friend", prompt: "Who is Harry Potter's best friend with red hair?", answer: "Ron Weasley" },
      { category: "Friend", prompt: "Which brilliant witch is one of Harry's closest friends?", answer: "Hermione Granger" },
      { category: "Sport", prompt: "What flying sport is played at Hogwarts?", answer: "Quidditch" },
      { category: "Position", prompt: "In Quidditch, what position does Harry usually play?", answer: "Seeker" },
      { category: "Creature", prompt: "What kind of creature is Hagrid's pet Fang?", answer: "Dog" },
      { category: "Platform", prompt: "What is the platform number for the Hogwarts Express?", answer: "Platform 9 3/4" },
      { category: "Train", prompt: "What is the name of the train to Hogwarts?", answer: "Hogwarts Express" },
      { category: "Bank", prompt: "What is the name of the wizard bank in Diagon Alley?", answer: "Gringotts" },
      { category: "Shop", prompt: "Where do students buy wands in Diagon Alley?", answer: "Ollivanders" },
      { category: "Potion", prompt: "What class does Professor Snape teach in Harry's first year?", answer: "Potions" },
      { category: "Care", prompt: "Who teaches Care of Magical Creatures after becoming a professor?", answer: "Hagrid" },
      { category: "Prison", prompt: "What is the wizard prison called?", answer: "Azkaban" },
      { category: "Spell", prompt: "Which spell is commonly used to disarm an opponent?", answer: "Expelliarmus" },
      { category: "Spell", prompt: "Which charm creates light at the tip of a wand?", answer: "Lumos" },
      { category: "School", prompt: "What is the forbidden forest near Hogwarts called?", answer: "Forbidden Forest" },
      { category: "Map", prompt: "What magical map shows people moving around Hogwarts?", answer: "Marauder's Map" },
      { category: "Family", prompt: "What is Harry's owl's name?", answer: "Hedwig" },
      { category: "Artifact", prompt: "What shape is the scar on Harry's forehead?", answer: "Lightning bolt" },
      { category: "Shop", prompt: "What wizard village near Hogwarts has many shops?", answer: "Hogsmeade" },
      { category: "Defense", prompt: "What does D.A. stand for?", answer: "Dumbledore's Army" },
      { category: "Family", prompt: "What family are Ron and Ginny part of?", answer: "Weasley" },
      { category: "House", prompt: "Which Hogwarts house values bravery and courage?", answer: "Gryffindor" },
      { category: "House", prompt: "Which Hogwarts house is known for ambition and cunning?", answer: "Slytherin" },
      { category: "House", prompt: "Which Hogwarts house is associated with loyalty and hard work?", answer: "Hufflepuff" },
      { category: "House", prompt: "Which Hogwarts house is linked to wisdom and wit?", answer: "Ravenclaw" },
      { category: "Professor", prompt: "Who teaches Transfiguration at Hogwarts in the early books?", answer: "McGonagall" },
      { category: "Professor", prompt: "Who is the half-giant groundskeeper and friend of Harry?", answer: "Hagrid" },
      { category: "Spell", prompt: "Which spell is used to open locks?", answer: "Alohomora" },
      { category: "Spell", prompt: "Which charm levitates objects?", answer: "Wingardium Leviosa" },
      { category: "Spell", prompt: "Which spell produces a shield against dark magic?", answer: "Protego" },
      { category: "Creature", prompt: "What magical creature guards Gringotts vaults?", answer: "Dragon" },
      { category: "Treat", prompt: "What candy wizard kids often eat that includes chocolate frogs?", answer: "Chocolate Frog" },
      { category: "Sweet", prompt: "What sweet shop is famous in Hogsmeade?", answer: "Honeydukes" },
      { category: "Object", prompt: "What object helps students see the future in Divination?", answer: "Crystal ball" },
      { category: "Match", prompt: "What sport uses brooms and four balls?", answer: "Quidditch" },
      { category: "Founders", prompt: "Which Hogwarts founder was known for being brave and noble?", answer: "Godric Gryffindor" },
      { category: "Founders", prompt: "Which Hogwarts founder valued intelligence and learning?", answer: "Rowena Ravenclaw" },
      { category: "Founders", prompt: "Which Hogwarts founder valued loyalty and patience?", answer: "Helga Hufflepuff" },
      { category: "Founders", prompt: "Which Hogwarts founder is linked with ambition and pure-blood ideals?", answer: "Salazar Slytherin" },
      { category: "Place", prompt: "What is the name of the wizarding shopping street in London?", answer: "Diagon Alley" },
      { category: "Place", prompt: "What is the hidden pub entrance to Diagon Alley called?", answer: "Leaky Cauldron" },
      { category: "Character", prompt: "Who is the gamekeeper and groundskeeper at Hogwarts?", answer: "Rubeus Hagrid" },
      { category: "Character", prompt: "Who is the caretaker at Hogwarts who dislikes students in the early books?", answer: "Argus Filch" },
      { category: "Character", prompt: "Who is Harry's godfather?", answer: "Sirius Black" },
      { category: "Character", prompt: "What is the name of Harry's mentor who becomes Defense Against the Dark Arts professor?", answer: "Remus Lupin" },
      { category: "Character", prompt: "Who is the Potions Master before Snape is promoted?", answer: "Slughorn" },
      { category: "Character", prompt: "Who runs the Order of the Phoenix headquarters family house?", answer: "Molly Weasley" },
      { category: "Creature", prompt: "What small magical animal guards the entrance to some wizarding homes?", answer: "House-elf" },
      { category: "Creature", prompt: "What creature is Buckbeak?", answer: "Hippogriff" },
      { category: "Creature", prompt: "What giant spider lives in the Forbidden Forest?", answer: "Acromantula" },
      { category: "Creature", prompt: "What kind of creature is Norbert?", answer: "Dragon" },
      { category: "Object", prompt: "What magical item sorts new students into houses?", answer: "Sorting Hat" },
      { category: "Object", prompt: "What magical object reflects your deepest desire?", answer: "Mirror of Erised" },
      { category: "Object", prompt: "What device allows a witch or wizard to travel through time briefly?", answer: "Time-Turner" },
      { category: "Object", prompt: "What item stores memories in a basin-like container?", answer: "Pensieve" },
      { category: "Object", prompt: "What magical paper shows the location of people at Hogwarts?", answer: "Marauder's Map" },
      { category: "Spell", prompt: "Which spell stuns an opponent?", answer: "Stupefy" },
      { category: "Spell", prompt: "Which spell makes an object fly toward you?", answer: "Accio" },
      { category: "Spell", prompt: "Which spell repairs broken glasses and objects?", answer: "Reparo" },
      { category: "Spell", prompt: "Which curse causes severe pain?", answer: "Crucio" },
      { category: "Spell", prompt: "Which curse kills a target instantly?", answer: "Avada Kedavra" },
      { category: "Spell", prompt: "Which spell is used to reveal hidden objects?", answer: "Revelio" },
      { category: "Place", prompt: "What is the name of Hogwarts' train station?", answer: "King's Cross" },
      { category: "Place", prompt: "What village do Hogwarts students visit on weekends?", answer: "Hogsmeade" },
      { category: "Place", prompt: "What is the name of the room that appears only when needed?", answer: "Room of Requirement" },
      { category: "Place", prompt: "What forest lies next to Hogwarts and is forbidden to students?", answer: "Forbidden Forest" },
      { category: "Creature", prompt: "What is a magical creature with a lion's body and eagle's head?", answer: "Griffin" },
      { category: "Creature", prompt: "What house creature is often bound to a wizarding family?", answer: "House-elf" },
      { category: "Creature", prompt: "What creature can read minds and is linked with Voldemort's pet?", answer: "Snake" },
      { category: "Artifact", prompt: "What object turns into a snake when spoken to in Parseltongue?", answer: "Diadem" },
      { category: "Artifact", prompt: "What famous object is the first Horcrux Harry destroys?", answer: "Diary" },
      { category: "Artifact", prompt: "What stone can bring back shades of the dead?", answer: "Resurrection Stone" },
      { category: "Artifact", prompt: "What cloak makes the wearer invisible?", answer: "Invisibility Cloak" },
      { category: "House", prompt: "Which house has a badger as its symbol?", answer: "Hufflepuff" },
      { category: "House", prompt: "Which house has an eagle as its symbol?", answer: "Ravenclaw" },
      { category: "House", prompt: "Which house has a lion as its symbol?", answer: "Gryffindor" },
      { category: "House", prompt: "Which house has a serpent as its symbol?", answer: "Slytherin" },
      { category: "Class", prompt: "Who teaches Divination for part of the series?", answer: "Trelawney" },
      { category: "Class", prompt: "Who teaches Muggle Studies in the early books?", answer: "Burbage" },
      { category: "Class", prompt: "Who teaches Flying lessons at Hogwarts in the first book?", answer: "Hooch" },
      { category: "Class", prompt: "Who teaches Ancient Runes to older students?", answer: "Babbling" },
      { category: "Team", prompt: "What is the name of the student group formed to learn Defense Against the Dark Arts?", answer: "Dumbledore's Army" },
      { category: "Wizarding World", prompt: "What is the name of the wizarding newspaper?", answer: "Daily Prophet" },
      { category: "Wizarding World", prompt: "What is the main wizarding bank?", answer: "Gringotts" },
      { category: "Wizarding World", prompt: "What is the train that brings students to Hogwarts?", answer: "Hogwarts Express" },
      { category: "Family", prompt: "What is the last name of Fred and George?", answer: "Weasley" },
      { category: "Family", prompt: "What is the last name of Draco?", answer: "Malfoy" },
      { category: "Family", prompt: "What is Harry's last name?", answer: "Potter" },
      { category: "Family", prompt: "What is Hermione's last name?", answer: "Granger" },
      { category: "Family", prompt: "What is Luna's last name?", answer: "Lovegood" }
    ];

    let game;

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = rand(0, index);
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function money(value) {
      return "$" + value.toLocaleString("en-US");
    }

    function choicesWithCorrect(correct) {
      const pool = trivia.map(function (item) { return item.answer; });
      const set = new Set([correct]);
      while (set.size < 4) {
        set.add(pool[rand(0, pool.length - 1)]);
      }
      return shuffle(Array.from(set));
    }

    function buildDeck() {
      return shuffle(trivia).slice(0, 15).map(function (item) {
        return {
          category: item.category,
          prompt: item.prompt,
          correct: item.answer,
          choices: choicesWithCorrect(item.answer)
        };
      });
    }

    function fallback(round) {
      if (round >= 10) return prizes[9];
      if (round >= 5) return prizes[4];
      return 0;
    }

    function newState() {
      return {
        round: 0,
        winnings: 0,
        complete: false,
        locked: false,
        deck: buildDeck()
      };
    }

    function renderLadder() {
      const ladder = document.getElementById("ladder");
      ladder.innerHTML = prizes.slice().reverse().map(function (prize, reverseIndex) {
        const level = prizes.length - reverseIndex;
        const classes = [];
        if (safeLevels.includes(level)) classes.push("safe");
        if (game.round === level && !game.complete) classes.push("active");
        if (level < game.round || (game.complete && game.round >= level)) classes.push("cleared");
        return "<li class=\"" + classes.join(" ") + "\"><span>" + level + "</span><span>" + money(prize) + "</span></li>";
      }).join("");
    }

    function render() {
      const roundBadge = document.getElementById("roundBadge");
      const winningsBadge = document.getElementById("winningsBadge");
      const category = document.getElementById("category");
      const question = document.getElementById("question");
      const answers = document.getElementById("answers");
      const message = document.getElementById("message");

      renderLadder();
      winningsBadge.textContent = "Current winnings: " + money(game.winnings);

      if (game.complete) {
        roundBadge.textContent = "Game complete";
        category.textContent = "Champion";
        question.textContent = "You reached the top prize.";
        answers.innerHTML = "";
        message.className = "message good";
        message.textContent = "You are the Harry Potter millionaire. Start a new game to play again.";
        return;
      }

      const q = game.deck[game.round];
      roundBadge.textContent = "Question " + (game.round + 1) + " of " + game.deck.length;
      category.textContent = q.category;
      question.textContent = q.prompt;
      answers.innerHTML = q.choices.map(function (choice, index) {
        return "<button class=\"answer\" type=\"button\" data-choice=\"" + choice + "\"><span class=\"letter\">" + letters[index] + "</span><span>" + choice + "</span></button>";
      }).join("");

      message.className = "message";
      message.textContent = "Pick one of the four options.";

      answers.querySelectorAll(".answer").forEach(function (button) {
        button.addEventListener("click", function () {
          submit(button.dataset.choice, button);
        });
      });
    }

    function markCorrect(correct) {
      document.querySelectorAll(".answer").forEach(function (button) {
        if (button.dataset.choice === correct) button.classList.add("correct");
      });
    }

    function disableAnswers() {
      document.querySelectorAll(".answer").forEach(function (button) {
        button.disabled = true;
      });
    }

    function submit(choice, button) {
      if (game.locked || game.complete) return;

      game.locked = true;
      disableAnswers();

      const q = game.deck[game.round];
      const statusTitle = document.getElementById("statusTitle");
      const statusCopy = document.getElementById("statusCopy");
      const message = document.getElementById("message");

      if (choice === q.correct) {
        button.classList.add("correct");
        game.winnings = prizes[game.round];
        game.round += 1;

        if (game.round >= game.deck.length) {
          game.complete = true;
          statusTitle.textContent = "Harry Potter Millionaire";
          statusCopy.textContent = "You answered every Harry Potter question correctly and reached the top prize.";
          render();
          game.locked = false;
          return;
        }

        statusTitle.textContent = "Still Climbing";
        statusCopy.textContent = "Correct answer. You moved one step higher on the prize ladder.";
        message.className = "message good";
        message.textContent = "Correct. You climb to " + money(game.winnings) + ".";

        window.setTimeout(function () {
          game.locked = false;
          render();
        }, 900);
        return;
      }

      button.classList.add("wrong");
      markCorrect(q.correct);
      game.winnings = fallback(game.round);
      game.complete = true;
      statusTitle.textContent = "Game Over";
      statusCopy.textContent = "Wrong answer. You dropped to the last safe level reached.";
      message.className = "message bad";
      message.textContent = "The correct answer was " + q.correct + ". You leave with " + money(game.winnings) + ".";
      renderLadder();
      document.getElementById("winningsBadge").textContent = "Current winnings: " + money(game.winnings);
      game.locked = false;
    }

    function startGame() {
      game = newState();
      document.getElementById("statusTitle").textContent = "Question One";
      document.getElementById("statusCopy").textContent = "Answer each Harry Potter question correctly to climb to the top prize.";
      render();
    }

    document.getElementById("newGame").addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
