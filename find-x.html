<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find the Missing Number</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #183153;
      background: linear-gradient(145deg, #d8f0ff, #fff9d7);
    }
    .container {
      max-width: 920px;
      margin: auto;
      padding: 24px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 35px rgba(24, 49, 83, 0.12);
    }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
    a { color: #1d5fa7; }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: #1d5fa7;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:focus-visible, a:focus-visible { outline: 3px solid #bb7800; outline-offset: 3px; }
    h1 { margin: 0 0 10px; font-size: 2rem; color: #1d5fa7; }
    h2 { margin: 16px 0 8px; font-size: 1.15rem; }
    p { margin: 6px 0; line-height: 1.5; }
    .student { display: flex; flex-wrap: wrap; gap: 24px; margin: 16px 0; }
    .questions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0; list-style: none; }
    .question { padding: 12px; border: 1px solid #b9d8ec; border-radius: 10px; break-inside: avoid; }
    .equation { font-size: 1.25rem; font-weight: bold; }
    .answer { margin-top: 12px; }
    @media (max-width: 520px) {
      body { padding: 10px; }
      .container { padding: 16px; }
      .questions { grid-template-columns: 1fr; }
    }
    @page { size: portrait; margin: 0.4in; }
    @media print {
      body { padding: 0; color: black; background: white; font-size: 10pt; }
      .container { max-width: none; padding: 0; border-radius: 0; box-shadow: none; }
      .toolbar { display: none; }
      h1 { font-size: 20pt; margin-bottom: 6px; color: black; }
      h2 { margin: 10px 0 6px; font-size: 12pt; }
      p { line-height: 1.3; }
      .student { margin: 10px 0; }
      .questions { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 8px 0 0; }
      .question { padding: 5px 10px; border-color: #888; line-height: 1.2; }
      .equation { font-size: 13pt; }
      .answer { margin-top: 7px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="toolbar" aria-label="Worksheet controls">
      <a href="index.html">Back to all pages</a>
      <button type="button" id="new-questions">New Questions</button>
      <button type="button" id="print">Print Worksheet</button>
    </nav>
    <h1>Find the Missing Number</h1>
    <p>36 questions: find x in each equation and write your answer below.</p>
    <div class="student">
      <span>Name: ________________________</span>
      <span>Date: ________________</span>
    </div>
    <section aria-labelledby="practice-title">
      <h2 id="practice-title">Practice: what is x?</h2>
      <ol class="questions" id="questions"></ol>
    </section>
  </main>
  <script>
    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestions() {
      const questions = document.getElementById('questions');
      const operations = ['+', '\u2212', '\u00d7', '\u00f7'];
      const fragment = document.createDocumentFragment();
      const used = new Set();

      for (let i = 0; i < 36; i++) {
        const operation = operations[i % operations.length];
        const operand = rand(2, 10);
        let result = rand(1, 10);
        if (operation === '+') result += operand;
        if (operation === '\u00d7') result *= operand;

        // Cycle through valid results to avoid duplicate equations without retry loops.
        const step = operation === '\u00d7' ? operand : 1;
        let equation = `x ${operation} ${operand} = ${result}`;
        while (used.has(equation)) {
          result += step;
          equation = `x ${operation} ${operand} = ${result}`;
        }
        used.add(equation);

        const question = document.createElement('li');
        question.className = 'question';
        const prompt = document.createElement('div');
        prompt.className = 'equation';
        prompt.textContent = `${i + 1}. ${equation}`;
        const answer = document.createElement('div');
        answer.className = 'answer';
        answer.textContent = 'x = __________________';
        question.append(prompt, answer);
        fragment.appendChild(question);
      }
      questions.replaceChildren(fragment);
    }

    document.getElementById('new-questions').addEventListener('click', generateQuestions);
    document.getElementById('print').addEventListener('click', () => window.print());
    generateQuestions();
  </script>
</body>
</html>
